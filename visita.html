<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Visitas · Edu Marín</title>
  <meta name="robots" content="noindex, nofollow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
  </script>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.6.0/css/all.min.css" crossorigin="anonymous">

  <style>
    :root {
      --bg:      #101010; --surface: #1a1a1a; --surface2: #222;
      --sh:      #2a2a2a; --lime:    #CBFF3D; --ink:      #F4F4F0;
      --muted:   #8C8C86; --border:  #2A2A2A;
    }
    * { box-sizing: border-box; }
    body { background: var(--bg); color: var(--ink); font-family: 'Inter', sans-serif; min-height: 100vh; }

    /* Header */
    .v-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 18px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 40; gap: 10px; }
    .v-logo { font-weight: 700; font-size: 16px; color: var(--ink); text-decoration: none; white-space: nowrap; }
    .v-logo span { background: linear-gradient(135deg,#E53E3E,#F97316); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .v-header-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .v-tabs { display: flex; gap: 4px; }
    .v-tab { background: none; border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; transition: all 0.15s; font-family: 'Inter', sans-serif; white-space: nowrap; }
    .v-tab:hover { color: var(--ink); border-color: #444; }
    .v-tab.active { background: var(--lime); color: #101010; border-color: var(--lime); }
    .v-icon-btn { background: none; border: 1px solid var(--border); border-radius: 8px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; color: var(--muted); cursor: pointer; font-size: 13px; transition: all 0.15s; flex-shrink: 0; }
    .v-icon-btn:hover { color: var(--ink); border-color: #444; }
    .v-sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
    .v-sync-dot.ok { background: #4ade80; }
    .v-sync-dot.warn { background: #facc15; }

    /* Card */
    .v-card { background: var(--surface); border-radius: 16px; max-width: 560px; margin: 20px auto; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.4); }
    .v-card-header { padding: 18px 22px 14px; border-bottom: 1px solid var(--border); }
    .v-eyebrow { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 10px; }
    .v-eyebrow b { color: var(--lime); }
    .v-track { height: 3px; background: var(--border); border-radius: 4px; overflow: hidden; }
    .v-fill { height: 100%; background: var(--lime); border-radius: 4px; transition: width 0.4s cubic-bezier(.4,0,.2,1); }
    .v-body { padding: 22px; }
    .v-title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; margin: 0 0 14px; line-height: 1.3; }

    /* Inputs */
    .v-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; margin-top: 12px; }
    .v-label:first-child { margin-top: 0; }
    .v-input { width: 100%; background: var(--surface2); border: 1.5px solid var(--border); border-radius: 9px; padding: 10px 13px; color: var(--ink); font-family: 'Inter', sans-serif; font-size: 14px; display: block; }
    .v-input:focus { outline: none; border-color: var(--lime); }
    .v-input::placeholder { color: var(--muted); }
    .v-textarea { min-height: 75px; resize: vertical; }
    .v-date { color-scheme: dark; }

    /* Chips */
    .v-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .v-chip { background: var(--surface2); border: 1.5px solid var(--border); border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; transition: all 0.15s; font-family: 'Inter', sans-serif; display: flex; align-items: center; gap: 5px; }
    .v-chip:hover { border-color: #444; color: var(--ink); }
    .v-chip.active { background: rgba(203,255,61,0.1); border-color: var(--lime); color: var(--lime); }

    /* Opciones radio */
    .v-options { display: flex; flex-direction: column; gap: 6px; }
    .v-opt { background: var(--surface2); border: 1.5px solid var(--border); border-radius: 9px; padding: 10px 13px; font-size: 13px; font-weight: 500; color: var(--ink); cursor: pointer; display: flex; align-items: center; gap: 9px; transition: all 0.12s; font-family: 'Inter', sans-serif; text-align: left; width: 100%; }
    .v-opt:hover { border-color: #444; background: var(--sh); }
    .v-opt.active { background: rgba(203,255,61,0.08); border-color: var(--lime); }
    .v-dot { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid var(--muted); flex-shrink: 0; position: relative; }
    .v-opt.active .v-dot { border-color: var(--lime); }
    .v-opt.active .v-dot::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: var(--lime); }

    /* Nav */
    .v-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }
    .v-btn-back { background: none; border: none; color: var(--muted); font-size: 13px; font-weight: 500; cursor: pointer; padding: 8px 4px; font-family: 'Inter', sans-serif; }
    .v-btn-back:hover { color: var(--ink); }
    .v-btn-next { background: var(--lime); color: #101010; border: none; border-radius: 999px; padding: 10px 20px; font-weight: 700; font-size: 13px; cursor: pointer; font-family: 'Inter', sans-serif; transition: opacity 0.15s, transform 0.1s; }
    .v-btn-next:disabled { opacity: 0.3; cursor: not-allowed; }
    .v-btn-next:not(:disabled):hover { transform: translateY(-1px); }

    /* Config */
    .v-setup-card { background: var(--surface); border-radius: 14px; padding: 22px; margin-bottom: 14px; border: 1px solid var(--border); }

    /* Historial */
    .v-history { max-width: 560px; margin: 20px auto; padding: 0 16px 40px; }
    .v-history-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
    .v-search { background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 8px 14px 8px 36px; font-size: 13px; color: var(--ink); font-family: 'Inter', sans-serif; width: 200px; position: relative; }
    .v-search:focus { outline: none; border-color: var(--lime); }
    .v-search::placeholder { color: var(--muted); }
    .v-search-wrap { position: relative; }
    .v-search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 12px; pointer-events: none; }
    .v-filter-btns { display: flex; gap: 4px; flex-wrap: wrap; }
    .v-filter { background: none; border: 1px solid var(--border); border-radius: 999px; padding: 5px 10px; font-size: 11px; font-weight: 600; color: var(--muted); cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.12s; white-space: nowrap; }
    .v-filter:hover { color: var(--ink); }
    .v-filter.active { background: var(--lime); color: #101010; border-color: var(--lime); }
    .v-history-empty { text-align: center; color: var(--muted); padding: 50px 20px; font-size: 14px; }
    .v-sync-bar { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--muted); flex-wrap: wrap; gap: 8px; }
    .v-btn-syncall { background: none; border: 1px solid var(--lime); color: var(--lime); border-radius: 999px; padding: 5px 12px; font-size: 11px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; }
    .v-btn-syncall:hover { background: rgba(203,255,61,0.1); }

    /* Tarjetas visita */
    .v-visit-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 8px; cursor: pointer; transition: border-color 0.15s; }
    .v-visit-card:hover { border-color: #3a3a3a; }
    .v-visit-card.expanded { border-color: var(--lime); }
    .v-visit-head { display: flex; align-items: flex-start; gap: 10px; }
    .v-status-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
    .v-visit-main { flex: 1; min-width: 0; }
    .v-visit-name { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .v-visit-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .v-visit-meta { font-size: 11px; color: var(--muted); margin-top: 5px; display: flex; gap: 10px; flex-wrap: wrap; }
    .v-visit-meta span { display: flex; align-items: center; gap: 3px; }
    .v-follow-alert { color: #f87171; font-weight: 600; }
    .v-visit-detail { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 13px; line-height: 1.7; display: none; }
    .v-visit-card.expanded .v-visit-detail { display: block; }
    .v-detail-row { margin-bottom: 8px; }
    .v-detail-label { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 1px; }
    .v-visit-actions { display: flex; gap: 7px; margin-top: 12px; flex-wrap: wrap; }
    .v-btn-del { background: none; border: 1px solid #3f2020; color: #f87171; border-radius: 999px; padding: 5px 12px; font-size: 11px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; }
    .v-btn-del:hover { background: rgba(248,113,113,0.1); }
    .v-btn-wa { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 999px; padding: 5px 12px; font-size: 11px; font-weight: 600; font-family: 'Inter', sans-serif; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
    .v-btn-wa:hover { color: var(--ink); border-color: #444; }
    .v-btn-edit { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 999px; padding: 5px 12px; font-size: 11px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; }
    .v-btn-edit:hover { color: var(--ink); border-color: #444; }

    /* Guardado */
    .v-saved { text-align: center; padding: 36px 22px; }
    .v-saved-icon { font-size: 44px; margin-bottom: 14px; }
    .v-saved h2 { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px; color: var(--lime); margin-bottom: 6px; }
    .v-saved p { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .v-sync-status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 5px 12px; border-radius: 999px; margin-bottom: 20px; }
    .v-sync-status.ok   { background: rgba(74,222,128,0.12); color: #4ade80; border: 1px solid rgba(74,222,128,0.3); }
    .v-sync-status.local { background: rgba(250,204,21,0.1); color: #facc15; border: 1px solid rgba(250,204,21,0.3); }
    .v-saved-actions { display: flex; flex-direction: column; gap: 8px; max-width: 200px; margin: 0 auto; }
    .v-btn-primary { background: var(--lime); color: #101010; border: none; border-radius: 999px; padding: 11px 18px; font-weight: 700; font-size: 13px; cursor: pointer; font-family: 'Inter', sans-serif; }
    .v-btn-secondary { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 999px; padding: 10px 18px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; }
    .v-btn-secondary:hover { color: var(--ink); border-color: #444; }

    /* Config URL */
    .v-config { max-width: 560px; margin: 20px auto; padding: 0 16px 40px; }

    .v-screen { animation: vIn 0.22s ease; }
    @keyframes vIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }

    @media (max-width: 480px) {
      .v-card { margin: 10px; border-radius: 12px; }
      .v-body { padding: 16px; }
      .v-history, .v-config { padding: 0 10px 40px; }
      .v-search { width: 140px; }
    }
  </style>
</head>
<body>

  <header class="v-header">
    <a href="index.html" class="v-logo">Edu <span>Marín</span></a>
    <div class="v-header-right">
      <div class="v-tabs" id="vTabs" style="display:none">
        <button class="v-tab active" id="tabNueva"    type="button">+ Nueva</button>
        <button class="v-tab"        id="tabHistorial" type="button">Historial <span id="vCount"></span></button>
      </div>
      <button class="v-icon-btn" id="btnConfig" title="Configurar Google Sheets" style="display:none">
        <i class="fa-solid fa-gear" aria-hidden="true"></i>
      </button>
    </div>
  </header>

  <main id="vMain"></main>

  <script>
  (function () {
    'use strict';

    const TOKEN     = 'eMv_7Kx9pQ2r-Wt4nJu';
    const SK        = 'visitas_edu';
    const SHEET_URL = 'https://script.google.com/macros/s/AKfycbyYVsJM_NVZqeln6IBb8CZzUJFEKEofaasvPzeRNwNb43qPjdZvAN9kvIscHcv935sgqA/exec';

    /* ── Cuestionario ── */
    const QUESTIONS = [
      { q: '¿Cómo describirías tu situación con las redes ahora mismo?',
        hint: 'Elige la que más se acerque.',
        options: [
          { text: 'Casi no tengo nada montado, quiero arrancar bien',       pts:{E:2,D:1,R:0} },
          { text: 'Tengo cuentas activas pero todo va improvisado',          pts:{E:0,D:2,R:1} },
          { text: 'Tengo todo activo pero no me da la vida a gestionarlo',   pts:{E:0,D:0,R:3} },
          { text: 'Solo necesito un ajuste puntual muy concreto',            pts:{E:3,D:0,R:0} },
        ]},
      { q: '¿Qué es lo que más te gustaría conseguir?',
        options: [
          { text: 'Aparecer mejor en Google / Google Maps',                  pts:{E:2,D:0,R:0} },
          { text: 'Entender qué estoy haciendo mal y tener un plan claro',   pts:{E:0,D:3,R:0} },
          { text: 'Dejar de pensar en esto y que alguien lo lleve por mí',  pts:{E:0,D:0,R:3} },
          { text: 'Un empujón puntual a mi perfil o mi imagen',              pts:{E:3,D:0,R:0} },
        ]},
      { q: '¿Cuánto tiempo quieres dedicarle tú a partir de ahora?',
        options: [
          { text: 'Todo, solo necesito orientación de por dónde empezar',   pts:{E:0,D:2,R:0} },
          { text: 'Algo, pero necesito prioridades claras',                  pts:{E:1,D:2,R:0} },
          { text: 'Nada, prefiero delegarlo por completo',                   pts:{E:0,D:0,R:3} },
          { text: 'Ya lo tengo resuelto, es solo un tema puntual',           pts:{E:3,D:0,R:0} },
        ]},
      { q: '¿Con qué frecuencia te gustaría publicar o gestionar contenido?',
        options: [
          { text: 'No busco publicar contenido continuo ahora mismo',       pts:{E:2,D:0,R:0} },
          { text: 'Un plan de arranque, luego ya veré cómo sigo',           pts:{E:0,D:2,R:0} },
          { text: 'De forma constante, cada semana',                         pts:{E:0,D:0,R:3} },
        ]},
      { q: '¿Cuál es tu presupuesto orientativo?',
        options: [
          { text: 'Menos de 120€, algo puntual',                            pts:{E:3,D:0,R:0} },
          { text: 'Entre 150€ y 400€, en un pago único',                    pts:{E:0,D:3,R:0} },
          { text: 'Un mensual entre 150€ y 600€',                           pts:{E:0,D:0,R:3} },
          { text: 'Todavía no lo tengo claro',                              pts:{E:0,D:0,R:0} },
        ]},
    ];

    const RESULTS = {
      E: { label:'Express',     servicio:'Express (desde 60€)',     presupuesto:'Menos de 120€',
           price:'Desde 60€ · pago único',
           desc:'Una intervención rápida y concreta. Resolvemos un punto clave y, si más adelante quieres ir más lejos, escalamos.',
           includes:['Optimización de perfil (Instagram o LinkedIn)','Creación y config. de Google Business','Auditoría rápida de un canal'] },
      D: { label:'DIAGNÓSTICO', servicio:'DIAGNÓSTICO (150€–400€)', presupuesto:'150€ – 400€ (pago único)',
           price:'150€ – 400€ · pago único',
           desc:'Antes de invertir en gestión continua, entendemos qué falla y te dejamos un plan claro y priorizado.',
           includes:['Auditoría de 1–2 canales o multicanal completa','Plan de acción a 30 o 90 días','Sesión de entrega para resolver dudas'] },
      R: { label:'REDES',       servicio:'REDES (150€–600€/mes)',   presupuesto:'150€ – 600€ / mes',
           price:'150€ – 600€ / mes',
           desc:'Gestión mensual completa: contenido, interacción y reporting adaptados al número de canales que necesites.',
           includes:['Gestión de 1 a 3+ redes sociales','Contenido, calendario e interacción con la comunidad','Reporting mensual de resultados'] },
    };

    const PASOS = [
      'Pendiente de visita',
      'Enviar presupuesto',
      'Segunda reunión',
      'Firmar contrato',
      'Cliente activo',
      'No quiere por ahora',
      'Descartado',
    ];

    const PASO_COLOR = {
      'Pendiente de visita': '#94a3b8',
      'Enviar presupuesto':  '#CBFF3D',
      'Segunda reunión':     '#60a5fa',
      'Firmar contrato':     '#4ade80',
      'Cliente activo':      '#22c55e',
      'No quiere por ahora': '#facc15',
      'Descartado':          '#6B7280',
    };

    const TOTAL_STEPS = 1 + QUESTIONS.length + 2;

    function computeWinner(answers) {
      const t = {E:0,D:0,R:0};
      answers.forEach(a => { if (a) { t.E+=a.pts.E; t.D+=a.pts.D; t.R+=a.pts.R; } });
      return Object.keys(t).reduce((a,b) => t[b]>t[a]?b:a);
    }

    /* ── Helpers ── */
    function esc(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }
    function today()    { return new Date().toISOString().slice(0,10); }
    function fmtDate(d) { if (!d) return '—'; const [y,m,dd] = d.split('-'); return `${dd}/${m}/${y}`; }
    function uid()      { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
    function isPast(d)  { return d && d < today(); }
    function isToday(d) { return d && d === today(); }

    /* ── Storage ── */
    function loadAll()    { try { return JSON.parse(localStorage.getItem(SK)||'[]'); } catch { return []; } }
    function saveAll(arr) { localStorage.setItem(SK, JSON.stringify(arr)); }
    function addVisit(v)  { const a = loadAll(); a.unshift(v); saveAll(a); }
    function delVisit(id) { saveAll(loadAll().filter(v=>v.id!==id)); }
    function updateVisit(v) { saveAll(loadAll().map(x => x.id === v.id ? v : x)); }
    function getSheetURL() { return SHEET_URL; }

    /* ── Google Sheets sync ── */
    async function syncToSheets(v, url) {
      if (!url) return false;
      try {
        await fetch(url, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({...v, _token: TOKEN}),
        });
        return true;
      } catch { return false; }
    }

    async function syncAllToSheets() {
      const url = getSheetURL();
      if (!url) return 0;
      const all = loadAll();
      let ok = 0;
      for (const v of all) {
        const sent = await syncToSheets(v, url);
        if (sent) ok++;
      }
      return ok;
    }

    /* ── Estado global ── */
    const mainEl   = document.getElementById('vMain');
    const tabs     = document.getElementById('vTabs');
    const tabN     = document.getElementById('tabNueva');
    const tabH     = document.getElementById('tabHistorial');
    const vCount   = document.getElementById('vCount');
    const btnCfg   = document.getElementById('btnConfig');

    let screen     = loadAll().length > 0 ? 'history' : 'new';
    let step       = 1;
    let lastSynced = false;
    let expandedId = null;
    let filterPaso = 'todos';
    let draft      = freshDraft();

    function freshDraft() {
      return {
        id: uid(), fechaVisita: today(),
        cliente:      { nombre:'', negocio:'', email:'', telefono:'' },
        cuestionario: { answers: new Array(QUESTIONS.length).fill(null), winnerLevel: null },
        acuerdo:      { servicio:'', presupuesto:'', proximoPaso:'', fechaSeg:'', notas:'' },
        createdAt: new Date().toISOString(),
      };
    }

    /* ── Render principal ── */
    function render() {
      updateHeader();
      if      (screen === 'new')      renderStep();
      else if (screen === 'saved')    renderSaved();
      else if (screen === 'history')  renderHistory();
      else if (screen === 'config')   renderConfig();
    }

    function updateHeader() {
      const n = loadAll().length;
      tabs.style.display   = 'flex';
      btnCfg.style.display = 'flex';
      vCount.textContent = n > 0 ? `(${n})` : '';
      tabN.classList.toggle('active', screen === 'new' || screen === 'saved');
      tabH.classList.toggle('active', screen === 'history');
    }

    /* ── Tabs y config ── */
    tabN.addEventListener('click', () => { draft = freshDraft(); step = 1; screen = 'new'; render(); });
    tabH.addEventListener('click', () => { screen = 'history'; render(); });
    btnCfg.addEventListener('click', () => { screen = 'config'; render(); });

    /* ── CONFIG ── */
    function renderConfig() {
      mainEl.innerHTML = `
        <div class="v-config v-screen">
          <div class="v-setup-card">
            <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;margin-bottom:12px;">Configuración</div>

            <p style="font-size:13px;color:var(--muted);margin-bottom:16px;">
              <span style="color:#4ade80">✓ Google Sheets conectado</span>
            </p>

            <div style="margin-top:4px;padding-top:16px;border-top:1px solid var(--border);">
              <p style="font-size:13px;color:var(--muted);margin-bottom:10px;">Enviar todas las visitas guardadas a Google Sheets:</p>
              <button class="v-btn-syncall" id="cfgSyncAll" type="button"><i class="fa-solid fa-rotate"></i> Sincronizar todo ahora</button>
              <p id="cfgSyncMsg" style="font-size:12px;color:var(--muted);margin-top:8px;display:none;"></p>
            </div>

            <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border);">
              <button class="v-btn-back" id="cfgBack" type="button">← Volver al historial</button>
            </div>
          </div>
        </div>`;

      document.getElementById('cfgBack').addEventListener('click', () => { screen = 'history'; render(); });

      document.getElementById('cfgSyncAll').addEventListener('click', async () => {
        const syncBtn = document.getElementById('cfgSyncAll');
        syncBtn.disabled = true;
        syncBtn.textContent = 'Sincronizando…';
        const n = await syncAllToSheets();
        const msg = document.getElementById('cfgSyncMsg');
        msg.style.display = 'block';
        msg.style.color = '#4ade80';
        msg.textContent = `✓ ${n} visita${n !== 1 ? 's' : ''} enviada${n !== 1 ? 's' : ''} a Google Sheets.`;
        syncBtn.disabled = false;
        syncBtn.innerHTML = '<i class="fa-solid fa-rotate"></i> Sincronizar todo ahora';
      });
    }

    /* ── STEPS ── */
    function progress(s) { return Math.round(s / TOTAL_STEPS * 100); }

    function renderStep() {
      if (step === 1)                                   return renderDataStep();
      if (step >= 2 && step <= 1 + QUESTIONS.length)   return renderQuestionStep(step - 2);
      if (step === QUESTIONS.length + 2)                return renderResultStep();
      if (step === QUESTIONS.length + 3)                return renderClosingStep();
    }

    function renderDataStep() {
      mainEl.innerHTML = `
        <div class="v-card">
          <div class="v-card-header">
            <div class="v-eyebrow">Datos del cliente · paso <b>1</b> de ${TOTAL_STEPS}</div>
            <div class="v-track"><div class="v-fill" style="width:${progress(1)}%"></div></div>
          </div>
          <div class="v-body v-screen">
            <p class="v-title">¿Con quién has quedado?</p>
            <label class="v-label" for="s1N">Nombre *</label>
            <input class="v-input" id="s1N" type="text"  placeholder="Nombre del cliente" maxlength="100" autocomplete="off">
            <label class="v-label" for="s1G">Negocio *</label>
            <input class="v-input" id="s1G" type="text"  placeholder="Nombre del negocio" maxlength="150" autocomplete="off">
            <label class="v-label" for="s1E">Email</label>
            <input class="v-input" id="s1E" type="email" placeholder="email@negocio.com"  maxlength="200" autocomplete="off">
            <label class="v-label" for="s1T">Teléfono</label>
            <input class="v-input" id="s1T" type="tel"   placeholder="6XX XXX XXX"        maxlength="20">
            <label class="v-label" for="s1F">Fecha de la visita</label>
            <input class="v-input v-date" id="s1F" type="date" value="${esc(draft.fechaVisita)}">
            <div class="v-nav">
              <span></span>
              <button class="v-btn-next" id="s1Next" type="button" disabled>Cuestionario →</button>
            </div>
          </div>
        </div>`;

      const nEl = document.getElementById('s1N'), gEl = document.getElementById('s1G');
      const next = document.getElementById('s1Next');
      nEl.value = draft.cliente.nombre; gEl.value = draft.cliente.negocio;
      document.getElementById('s1E').value = draft.cliente.email;
      document.getElementById('s1T').value = draft.cliente.telefono;
      nEl.focus();
      function chk() { next.disabled = !(nEl.value.trim() && gEl.value.trim()); }
      [nEl, gEl].forEach(el => el.addEventListener('input', chk)); chk();
      next.addEventListener('click', () => {
        draft.cliente.nombre   = nEl.value.trim();
        draft.cliente.negocio  = gEl.value.trim();
        draft.cliente.email    = document.getElementById('s1E').value.trim();
        draft.cliente.telefono = document.getElementById('s1T').value.trim();
        draft.fechaVisita      = document.getElementById('s1F').value || today();
        step = 2; renderStep();
      });
    }

    function renderQuestionStep(qIdx) {
      const q      = QUESTIONS[qIdx];
      const stepN  = qIdx + 2;
      const ans    = draft.cuestionario.answers[qIdx];
      const selIdx = ans ? ans.idx : -1;

      mainEl.innerHTML = `
        <div class="v-card">
          <div class="v-card-header">
            <div class="v-eyebrow">Pregunta <b>${qIdx+1}</b> de ${QUESTIONS.length} · paso ${stepN} de ${TOTAL_STEPS}</div>
            <div class="v-track"><div class="v-fill" style="width:${progress(stepN)}%"></div></div>
          </div>
          <div class="v-body v-screen">
            <p class="v-title">${esc(q.q)}</p>
            ${q.hint ? `<p style="font-size:13px;color:var(--muted);margin:-8px 0 14px;">${esc(q.hint)}</p>` : ''}
            <div class="v-options" id="qOpts">
              ${q.options.map((o,i) => `
                <button class="v-opt${i===selIdx?' active':''}" data-idx="${i}" type="button">
                  <span class="v-dot" aria-hidden="true"></span>${esc(o.text)}
                </button>`).join('')}
            </div>
            <div class="v-nav">
              <button class="v-btn-back" id="qBack" type="button">← Volver</button>
              <button class="v-btn-next" id="qNext" type="button" ${selIdx<0?'disabled':''}>Siguiente →</button>
            </div>
          </div>
        </div>`;

      document.querySelectorAll('#qOpts .v-opt').forEach(btn => {
        btn.addEventListener('click', () => {
          const i = parseInt(btn.dataset.idx, 10);
          draft.cuestionario.answers[qIdx] = { idx:i, pts:q.options[i].pts };
          document.querySelectorAll('#qOpts .v-opt').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById('qNext').disabled = false;
        });
      });
      document.getElementById('qBack').addEventListener('click', () => { step--; renderStep(); });
      document.getElementById('qNext').addEventListener('click', () => { step++; renderStep(); });
    }

    function renderResultStep() {
      const winner = computeWinner(draft.cuestionario.answers);
      draft.cuestionario.winnerLevel = winner;
      const r = RESULTS[winner];
      draft.acuerdo.servicio    = r.servicio;
      draft.acuerdo.presupuesto = r.presupuesto;
      const stepN = QUESTIONS.length + 2;

      mainEl.innerHTML = `
        <div class="v-card">
          <div class="v-card-header">
            <div class="v-eyebrow">Resultado · paso <b>${stepN}</b> de ${TOTAL_STEPS}</div>
            <div class="v-track"><div class="v-fill" style="width:${progress(stepN)}%"></div></div>
          </div>
          <div class="v-body v-screen">
            <div style="font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px;">Servicio recomendado</div>
            <div style="display:inline-flex;align-items:center;background:var(--lime);color:#101010;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;padding:10px 20px;border-radius:999px;margin-bottom:16px;">${esc(r.label)}</div>
            <p style="font-size:14px;color:var(--muted);line-height:1.65;margin-bottom:16px;">${esc(r.desc)}</p>
            <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;color:var(--lime);margin-bottom:14px;">${esc(r.price)}</div>
            <div style="background:var(--surface2);border-radius:10px;padding:14px 16px;">
              <div style="font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;">Suele incluir</div>
              <ul style="margin:0;padding:0 0 0 16px;font-size:13px;line-height:1.85;color:var(--ink);">
                ${r.includes.map(i=>`<li>${esc(i)}</li>`).join('')}
              </ul>
            </div>
            <div class="v-nav">
              <button class="v-btn-back" id="rBack" type="button">← Volver</button>
              <button class="v-btn-next" id="rNext" type="button">Cerrar visita →</button>
            </div>
          </div>
        </div>`;

      document.getElementById('rBack').addEventListener('click', () => { step--; renderStep(); });
      document.getElementById('rNext').addEventListener('click', () => { step++; renderStep(); });
    }

    function renderClosingStep() {
      const r = draft.cuestionario?.winnerLevel ? RESULTS[draft.cuestionario.winnerLevel] : null;
      const stepN = QUESTIONS.length + 3;

      mainEl.innerHTML = `
        <div class="v-card">
          <div class="v-card-header">
            <div class="v-eyebrow">Conclusiones · paso <b>${stepN}</b> de ${TOTAL_STEPS}</div>
            <div class="v-track"><div class="v-fill" style="width:${progress(stepN)}%"></div></div>
          </div>
          <div class="v-body v-screen">
            <p class="v-title">¿Cuál es el siguiente paso?</p>
            ${r ? `<div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;padding:10px 14px;background:rgba(203,255,61,0.06);border:1px solid rgba(203,255,61,0.2);border-radius:10px;flex-wrap:wrap;">
              <span style="font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:0.06em;">Recomendación</span>
              <span style="font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--lime);">${esc(r.label)}</span>
              <span style="font-size:12px;color:var(--muted);">· ${esc(r.price)}</span>
            </div>` : ''}
            <label class="v-label">Próximo paso *</label>
            <div class="v-options" id="cPasos">
              ${PASOS.map(p => `
                <button class="v-opt${draft.acuerdo.proximoPaso===p?' active':''}" data-val="${esc(p)}" type="button">
                  <span class="v-dot" aria-hidden="true"></span>
                  <span style="display:flex;align-items:center;gap:7px;">
                    <span style="width:8px;height:8px;border-radius:50%;background:${PASO_COLOR[p]||'var(--muted)'};flex-shrink:0;"></span>
                    ${esc(p)}
                  </span>
                </button>`).join('')}
            </div>
            <label class="v-label" for="cF" style="margin-top:14px;">Fecha de seguimiento</label>
            <input class="v-input v-date" id="cF" type="date" value="${esc(draft.acuerdo.fechaSeg)}">
            <label class="v-label" for="cN">Notas de la visita</label>
            <textarea class="v-input v-textarea" id="cN" placeholder="Impresión general, acuerdos verbales, detalles importantes…" maxlength="800" rows="3"></textarea>
            <div class="v-nav">
              <button class="v-btn-back" id="cBack" type="button">← Volver</button>
              <button class="v-btn-next" id="cSave" type="button" disabled>Guardar visita</button>
            </div>
          </div>
        </div>`;

      document.getElementById('cN').value = draft.acuerdo.notas;
      function chkSave() { document.getElementById('cSave').disabled = !draft.acuerdo.proximoPaso; }
      chkSave();
      document.querySelectorAll('#cPasos .v-opt').forEach(btn => {
        btn.addEventListener('click', () => {
          draft.acuerdo.proximoPaso = btn.dataset.val;
          document.querySelectorAll('#cPasos .v-opt').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          chkSave();
        });
      });
      document.getElementById('cBack').addEventListener('click', () => { step--; renderStep(); });
      document.getElementById('cSave').addEventListener('click', async () => {
        draft.acuerdo.fechaSeg = document.getElementById('cF').value;
        draft.acuerdo.notas    = document.getElementById('cN').value.trim();
        const btn = document.getElementById('cSave');
        btn.textContent = 'Guardando…'; btn.disabled = true;
        const isEdit = loadAll().some(x => x.id === draft.id);
        if (isEdit) updateVisit(draft); else addVisit(draft);
        lastSynced = await syncToSheets(draft, getSheetURL());
        screen = 'saved'; render();
      });
    }

    /* ── SAVED ── */
    function renderSaved() {
      const syncHTML = lastSynced
        ? `<div class="v-sync-status ok"><i class="fa-solid fa-circle-check"></i> Guardado en Google Sheets</div>`
        : `<div class="v-sync-status local"><i class="fa-solid fa-triangle-exclamation"></i> Sin conexión — guardado solo en este dispositivo</div>`;
      const r = draft.cuestionario?.winnerLevel ? RESULTS[draft.cuestionario.winnerLevel] : null;

      mainEl.innerHTML = `
        <div class="v-card">
          <div class="v-card-header">
            <div class="v-eyebrow">Visita guardada</div>
            <div class="v-track"><div class="v-fill" style="width:100%"></div></div>
          </div>
          <div class="v-saved v-screen">
            <div class="v-saved-icon">✅</div>
            <h2>¡Guardado!</h2>
            <p><strong style="color:var(--ink)">${esc(draft.cliente.nombre)}</strong> · ${esc(draft.cliente.negocio)}</p>
            ${r ? `<p style="margin-bottom:6px;"><span style="background:var(--lime);color:#101010;font-weight:700;font-size:12px;padding:3px 10px;border-radius:999px;">${esc(r.label)}</span></p>` : ''}
            ${syncHTML}
            <div class="v-saved-actions">
              <button class="v-btn-primary" id="svNueva" type="button">+ Nueva visita</button>
              <button class="v-btn-secondary" id="svHistorial" type="button">Ver historial</button>
            </div>
          </div>
        </div>`;

      document.getElementById('svNueva').addEventListener('click', () => { draft = freshDraft(); step = 1; screen = 'new'; render(); });
      document.getElementById('svHistorial').addEventListener('click', () => { screen = 'history'; render(); });
    }

    /* ── HISTORY ── */
    const FILTER_LABELS = {
      'todos':               'Todos',
      'Pendiente de visita': 'Pendiente',
      'Enviar presupuesto':  'Presupuesto',
      'Segunda reunión':     '2ª reunión',
      'Firmar contrato':     'Firmar',
      'Cliente activo':      'Cliente',
      'No quiere por ahora': 'No ahora',
      'Descartado':          'Descartado',
    };

    function renderHistory() {
      const all    = loadAll();
      const today_ = today();
      const CLOSED = ['Cliente activo','Descartado','Cliente descartado'];
      const alerts = all.filter(v => v.acuerdo.fechaSeg && v.acuerdo.fechaSeg <= today_ && !CLOSED.includes(v.acuerdo.proximoPaso));
      const filtered = filterPaso === 'todos' ? all : all.filter(v => v.acuerdo.proximoPaso === filterPaso);
      const searchVal = (mainEl.querySelector('#vSearch')?.value || '').toLowerCase();
      const shown = filtered.filter(v =>
        !searchVal ||
        (v.cliente.nombre  || '').toLowerCase().includes(searchVal) ||
        (v.cliente.negocio || '').toLowerCase().includes(searchVal)
      );

      mainEl.innerHTML = `
        <div class="v-history v-screen">

          ${alerts.length > 0 ? `
          <div style="background:rgba(248,113,113,0.08);border:1px solid rgba(248,113,113,0.3);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:12px;color:#f87171;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
            <i class="fa-solid fa-bell"></i>
            <span>${alerts.length} seguimiento${alerts.length>1?'s':''} pendiente${alerts.length>1?'s':''}:</span>
            <strong>${alerts.map(v=>esc(v.cliente.nombre)).join(', ')}</strong>
          </div>` : ''}

          <div class="v-history-toolbar">
            <div class="v-search-wrap">
              <i class="fa-solid fa-magnifying-glass v-search-icon" aria-hidden="true"></i>
              <input class="v-search" id="vSearch" type="search" placeholder="Buscar…" value="${esc(searchVal)}">
            </div>
            <div class="v-filter-btns">
              ${Object.entries(FILTER_LABELS).map(([k, label]) => `
                <button class="v-filter${filterPaso===k?' active':''}" data-f="${esc(k)}" type="button">
                  ${k!=='todos'?`<span style="width:6px;height:6px;border-radius:50%;background:${PASO_COLOR[k]||'var(--muted)'};display:inline-block;margin-right:3px;vertical-align:middle;"></span>`:''}${esc(label)}
                </button>`).join('')}
            </div>
          </div>

          <div class="v-sync-bar">
            <span><span class="v-sync-dot ok"></span> Google Sheets conectado · ${all.length} visita${all.length!==1?'s':''}</span>
            <button class="v-btn-syncall" id="hSyncAll" type="button"><i class="fa-solid fa-rotate"></i> Sincronizar todo</button>
          </div>

          ${shown.length === 0
            ? `<div class="v-history-empty"><p style="font-size:28px;margin-bottom:10px;">📋</p><p>${all.length===0?'Todavía no hay visitas guardadas.':'Ninguna visita coincide con el filtro.'}</p></div>`
            : shown.map(v => visitCardHTML(v, today_)).join('')}
        </div>`;

      document.getElementById('vSearch')?.addEventListener('input', () => renderHistory());
      document.querySelectorAll('.v-filter').forEach(btn => {
        btn.addEventListener('click', () => { filterPaso = btn.dataset.f; renderHistory(); });
      });
      document.getElementById('hSyncAll')?.addEventListener('click', async () => {
        const btn = document.getElementById('hSyncAll');
        btn.disabled = true; btn.textContent = 'Sincronizando…';
        const n = await syncAllToSheets();
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-rotate"></i> Sincronizar todo`;
        alert(`✓ ${n} visita${n!==1?'s':''} enviada${n!==1?'s':''} a Google Sheets.`);
      });
      document.querySelectorAll('.v-visit-card').forEach(card => {
        card.addEventListener('click', e => {
          if (e.target.closest('.v-visit-actions')) return;
          const id = card.dataset.id;
          expandedId = expandedId === id ? null : id;
          renderHistory();
        });
        card.querySelector('.v-btn-edit')?.addEventListener('click', e => {
          e.stopPropagation();
          const v = loadAll().find(x => x.id === card.dataset.id);
          if (!v) return;
          draft = { ...v, cuestionario: v.cuestionario || { answers: new Array(QUESTIONS.length).fill(null), winnerLevel: null } };
          step = 1; screen = 'new'; render();
        });
        card.querySelector('.v-btn-del')?.addEventListener('click', e => {
          e.stopPropagation();
          if (!confirm(`¿Eliminar la visita de ${card.dataset.nombre}?`)) return;
          delVisit(card.dataset.id);
          if (expandedId === card.dataset.id) expandedId = null;
          renderHistory();
        });
      });
    }

    function visitCardHTML(v, today_) {
      const color    = PASO_COLOR[v.acuerdo.proximoPaso] || 'var(--muted)';
      const waPhone  = (v.cliente.telefono||'').replace(/\D/g,'');
      const waURL    = waPhone ? `https://wa.me/34${waPhone}?text=${encodeURIComponent('Hola, soy Edu. Te escribo sobre nuestra reunión del '+fmtDate(v.fechaVisita)+'.')}` : '';
      const isExp    = expandedId === v.id;
      const segPast  = isPast(v.acuerdo.fechaSeg);
      const segToday = isToday(v.acuerdo.fechaSeg);
      const resLabel = v.cuestionario?.winnerLevel ? RESULTS[v.cuestionario.winnerLevel]?.label : null;

      return `
        <div class="v-visit-card${isExp?' expanded':''}" data-id="${esc(v.id)}" data-nombre="${esc(v.cliente.nombre)}">
          <div class="v-visit-head">
            <div class="v-status-dot" style="background:${color}" title="${esc(v.acuerdo.proximoPaso||'Sin definir')}"></div>
            <div class="v-visit-main">
              <div class="v-visit-name">${esc(v.cliente.nombre)} · <span style="font-weight:500">${esc(v.cliente.negocio)}</span></div>
              <div class="v-visit-sub" style="display:flex;align-items:center;gap:5px;flex-wrap:wrap;">
                ${resLabel ? `<span style="background:rgba(203,255,61,0.12);color:var(--lime);font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;">${esc(resLabel)}</span>` : ''}
                <span>${esc(v.acuerdo.proximoPaso||'—')}</span>
              </div>
              <div class="v-visit-meta">
                <span><i class="fa-regular fa-calendar" aria-hidden="true"></i> ${fmtDate(v.fechaVisita)}</span>
                ${v.acuerdo.fechaSeg ? `<span class="${segPast||segToday?'v-follow-alert':''}">
                  <i class="fa-solid fa-bell" aria-hidden="true"></i>
                  ${segPast?'Vencido: ':segToday?'Hoy: ':''}${fmtDate(v.acuerdo.fechaSeg)}
                </span>` : ''}
              </div>
            </div>
            <i class="fa-solid fa-chevron-${isExp?'up':'down'}" style="color:var(--muted);font-size:11px;margin-top:4px;flex-shrink:0"></i>
          </div>
          <div class="v-visit-detail">
            ${v.cliente.email    ? `<div class="v-detail-row"><span class="v-detail-label">Email</span>${esc(v.cliente.email)}</div>` : ''}
            ${v.cliente.telefono ? `<div class="v-detail-row"><span class="v-detail-label">Teléfono</span>${esc(v.cliente.telefono)}</div>` : ''}
            ${v.acuerdo.servicio    ? `<div class="v-detail-row"><span class="v-detail-label">Servicio</span>${esc(v.acuerdo.servicio)}</div>` : ''}
            ${v.acuerdo.presupuesto ? `<div class="v-detail-row"><span class="v-detail-label">Presupuesto</span>${esc(v.acuerdo.presupuesto)}</div>` : ''}
            ${v.situacion?.estadoActual ? `<div class="v-detail-row"><span class="v-detail-label">Situación</span>${esc(v.situacion.estadoActual)}</div>` : ''}
            ${v.situacion?.necesidades  ? `<div class="v-detail-row"><span class="v-detail-label">Necesidades</span>${esc(v.situacion.necesidades)}</div>` : ''}
            ${v.acuerdo.notas ? `<div class="v-detail-row"><span class="v-detail-label">Notas</span>${esc(v.acuerdo.notas)}</div>` : ''}
            <div class="v-visit-actions">
              ${waURL ? `<a class="v-btn-wa" href="${esc(waURL)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>` : ''}
              <button class="v-btn-edit" type="button" data-id="${esc(v.id)}"><i class="fa-solid fa-pen"></i> Editar</button>
              <button class="v-btn-del" type="button" data-id="${esc(v.id)}"><i class="fa-solid fa-trash-can"></i> Eliminar</button>
            </div>
          </div>
        </div>`;
    }

    render();
  })();
  </script>
</body>
</html>
