  <style>
    /* ── Widget styles – scoped a .qw-root para no colisionar con Tailwind ── */
    .qw-root {
      --qw-bg:           #101010;
      --qw-surface:      #1a1a1a;
      --qw-surface-h:    #232323;
      --qw-lime:         #CBFF3D;
      --qw-ink:          #F4F4F0;
      --qw-muted:        #8C8C86;
      --qw-border:       #2A2A2A;

      background: var(--qw-bg);
      color: var(--qw-ink);
      font-family: 'Inter', sans-serif;
      border-radius: 16px;
      max-width: 640px;
      margin: 0 auto;
      overflow: hidden;
      position: relative;
      min-height: 560px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 60px rgba(0,0,0,0.35);
    }
    .qw-header { padding: 28px 32px 20px; border-bottom: 1px solid var(--qw-border); }
    .qw-eyebrow { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--qw-muted); font-weight: 600; margin-bottom: 14px; }
    .qw-eyebrow b { color: var(--qw-lime); }
    .qw-track { height: 4px; background: var(--qw-border); border-radius: 4px; overflow: hidden; }
    .qw-fill { height: 100%; background: var(--qw-lime); width: 0%; transition: width 0.45s cubic-bezier(.4,0,.2,1); border-radius: 4px; }
    .qw-body { padding: 36px 32px; flex: 1; display: flex; flex-direction: column; }
    .qw-question { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 24px; line-height: 1.25; margin: 0 0 6px; letter-spacing: -0.01em; }
    .qw-hint { color: var(--qw-muted); font-size: 14px; margin: 0 0 24px; }
    .qw-options { display: flex; flex-direction: column; gap: 10px; }
    .qw-option {
      text-align: left; background: var(--qw-surface); border: 1.5px solid var(--qw-border);
      border-radius: 10px; padding: 15px 18px; color: var(--qw-ink); font-family: 'Inter', sans-serif;
      font-size: 15px; font-weight: 500; cursor: pointer; transition: all 0.15s ease;
      display: flex; align-items: center; gap: 12px;
    }
    .qw-option:hover { background: var(--qw-surface-h); border-color: #3a3a3a; }
    .qw-option.selected { background: rgba(203,255,61,0.1); border-color: var(--qw-lime); }
    .qw-option-dot { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--qw-muted); flex-shrink: 0; position: relative; }
    .qw-option.selected .qw-option-dot { border-color: var(--qw-lime); }
    .qw-option.selected .qw-option-dot::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: var(--qw-lime); }
    .qw-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 28px; }
    .qw-back { background: none; border: none; color: var(--qw-muted); font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; padding: 8px 4px; visibility: hidden; }
    .qw-back.visible { visibility: visible; }
    .qw-back:hover { color: var(--qw-ink); }
    .qw-next {
      background: var(--qw-lime); color: #101010; border: none; border-radius: 999px;
      padding: 12px 26px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px;
      cursor: pointer; opacity: 0.35; pointer-events: none; transition: opacity 0.15s ease, transform 0.1s ease;
    }
    .qw-next.active { opacity: 1; pointer-events: auto; }
    .qw-next.active:hover { transform: translateY(-1px); }
    .qw-result { display: flex; flex-direction: column; height: 100%; }
    .qw-result-tag { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--qw-muted); font-weight: 600; margin-bottom: 10px; }
    .qw-result-title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 34px; color: var(--qw-lime); margin: 0 0 12px; letter-spacing: -0.01em; }
    .qw-result-desc { font-size: 15px; color: var(--qw-ink); line-height: 1.55; margin: 0 0 20px; opacity: 0.9; }
    .qw-result-price { display: inline-block; background: var(--qw-lime); color: #101010; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; padding: 10px 20px; border-radius: 10px; margin-bottom: 24px; width: fit-content; }
    .qw-result-includes { background: var(--qw-surface); border: 1px solid var(--qw-border); border-radius: 12px; padding: 20px 22px; margin-bottom: 12px; }
    .qw-result-includes-title { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--qw-muted); font-weight: 600; margin: 0 0 12px; }
    .qw-result-includes ul { margin: 0; padding: 0 0 0 18px; font-size: 14px; line-height: 1.8; color: var(--qw-ink); }
    .qw-restart { background: none; border: 1px solid var(--qw-border); color: var(--qw-muted); border-radius: 999px; padding: 11px 20px; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; margin-top: 10px; align-self: flex-start; }
    .qw-restart:hover { color: var(--qw-ink); border-color: #3a3a3a; }
    .qw-result-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: auto; }
    .qw-email-btn { background: var(--qw-lime); color: #101010; text-decoration: none; border: none; border-radius: 999px; padding: 12px 22px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; transition: transform 0.1s ease; }
    .qw-email-btn:hover { transform: translateY(-1px); }
    .qw-screen { animation: qwFadeIn 0.3s ease; }
    @keyframes qwFadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .qw-input { background: var(--qw-surface); border: 1.5px solid var(--qw-border); border-radius: 10px; padding: 13px 16px; color: var(--qw-ink); font-family: 'Inter', sans-serif; font-size: 15px; margin-bottom: 12px; width: 100%; }
    .qw-input:focus { outline: none; border-color: var(--qw-lime); }
    .qw-input::placeholder { color: var(--qw-muted); }
    .qw-footer-link { background: none; border: none; color: var(--qw-muted); font-size: 11px; cursor: pointer; padding: 4px; align-self: center; opacity: 0.4; }
    .qw-footer-link:hover { opacity: 1; color: var(--qw-ink); }
    .qw-admin-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
    .qw-admin-table th { text-align: left; color: var(--qw-muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; padding: 8px 10px; border-bottom: 1px solid var(--qw-border); }
    .qw-admin-table td { padding: 10px; border-bottom: 1px solid var(--qw-border); color: var(--qw-ink); }
    .qw-admin-empty { color: var(--qw-muted); font-size: 14px; padding: 20px 0; }
    @media (max-width: 480px) {
      .qw-header, .qw-body { padding-left: 20px; padding-right: 20px; }
      .qw-question { font-size: 20px; }
      .qw-result-title { font-size: 26px; }
    }
  </style>
</head>

  <script>
  (function () {
    'use strict';

    const ADMIN_PASSPHRASE = "edu2026";
    const EDU_EMAIL        = "info@eduardomarin.es";

    /* Escapa HTML para evitar XSS al renderizar datos de usuario via innerHTML */
    function esc(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    const QUESTIONS = [
      {
        q: "¿Cómo describirías tu situación con las redes ahora mismo?",
        hint: "Elige la que más se acerque.",
        options: [
          { text: "Casi no tengo nada montado, quiero arrancar bien",     pts: { E: 2, D: 1, R: 0 } },
          { text: "Tengo cuentas activas pero todo va improvisado",        pts: { E: 0, D: 2, R: 1 } },
          { text: "Tengo todo activo pero no me da la vida a gestionarlo", pts: { E: 0, D: 0, R: 3 } },
          { text: "Solo necesito un ajuste puntual muy concreto",          pts: { E: 3, D: 0, R: 0 } },
        ]
      },
      {
        q: "¿Qué es lo que más te gustaría conseguir?",
        options: [
          { text: "Aparecer mejor en Google / Google Maps",               pts: { E: 2, D: 0, R: 0 } },
          { text: "Entender qué estoy haciendo mal y tener un plan claro", pts: { E: 0, D: 3, R: 0 } },
          { text: "Dejar de pensar en esto y que alguien lo lleve por mí", pts: { E: 0, D: 0, R: 3 } },
          { text: "Un empujón puntual a mi perfil o mi imagen",            pts: { E: 3, D: 0, R: 0 } },
        ]
      },
      {
        q: "¿Cuánto tiempo quieres dedicarle tú a partir de ahora?",
        options: [
          { text: "Todo, solo necesito orientación de por dónde empezar", pts: { E: 0, D: 2, R: 0 } },
          { text: "Algo, pero necesito prioridades claras",                pts: { E: 1, D: 2, R: 0 } },
          { text: "Nada, prefiero delegarlo por completo",                 pts: { E: 0, D: 0, R: 3 } },
          { text: "Ya lo tengo resuelto, es solo un tema puntual",         pts: { E: 3, D: 0, R: 0 } },
        ]
      },
      {
        q: "¿Con qué frecuencia te gustaría publicar o gestionar contenido?",
        options: [
          { text: "No busco publicar contenido continuo ahora mismo", pts: { E: 2, D: 0, R: 0 } },
          { text: "Un plan de arranque, luego ya veré cómo sigo",      pts: { E: 0, D: 2, R: 0 } },
          { text: "De forma constante, cada semana",                   pts: { E: 0, D: 0, R: 3 } },
        ]
      },
      {
        q: "¿Cuál es tu presupuesto orientativo?",
        options: [
          { text: "Menos de 120€, algo puntual",          pts: { E: 3, D: 0, R: 0 } },
          { text: "Entre 150€ y 400€, en un pago único",  pts: { E: 0, D: 3, R: 0 } },
          { text: "Un mensual entre 150€ y 600€",         pts: { E: 0, D: 0, R: 3 } },
          { text: "Todavía no lo tengo claro",            pts: { E: 0, D: 0, R: 0 } },
        ]
      },
    ];

    const RESULTS = {
      E: {
        title: "Nivel Express",
        desc:  "Necesitas una intervención puntual y rápida, no una gestión continua. Es el punto de entrada ideal: resolvemos algo concreto y, si más adelante quieres ir más lejos, escalamos a DIAGNÓSTICO o REDES.",
        price: "Desde 60€ · pago único",
        includes: [
          "Optimización de perfil (Instagram o LinkedIn)",
          "Creación y configuración de Google Business Profile",
          "Auditoría rápida de un solo canal",
        ],
      },
      D: {
        title: "DIAGNÓSTICO",
        desc:  "Antes de invertir en gestión continua, necesitas entender qué está fallando y tener un plan claro y priorizado. El DIAGNÓSTICO analiza tus canales y te deja un rumbo concreto a seguir.",
        price: "150€ – 400€ · pago único",
        includes: [
          "Auditoría de 1-2 canales o multicanal completa",
          "Plan de acción a 30 o 90 días",
          "Sesión de entrega para resolver dudas",
        ],
      },
      R: {
        title: "REDES",
        desc:  "Quieres dejar de pensar en tus redes y que alguien lo lleve de forma constante. REDES es la gestión mensual completa: contenido, interacción y reporting, adaptada al número de canales que necesites.",
        price: "150€ – 600€ / mes",
        includes: [
          "Gestión de 1 a 3+ redes sociales",
          "Contenido, calendario e interacción con la comunidad",
          "Reporting mensual de resultados",
        ],
      },
    };

    let current     = 0;
    let screen      = 'question';
    let winnerLevel = null;
    let contactInfo = { name: '', business: '' };
    const answers   = new Array(QUESTIONS.length).fill(null);
    const root      = document.getElementById('qwRoot');

    /* ── Almacenamiento ── */

    function storeEntry(entry) {
      try {
        const all = JSON.parse(localStorage.getItem('qw_submissions') || '[]');
        all.unshift(entry);
        localStorage.setItem('qw_submissions', JSON.stringify(all.slice(0, 100)));
      } catch (_) { /* localStorage desactivado o lleno */ }
    }

    function storeList() {
      try { return JSON.parse(localStorage.getItem('qw_submissions') || '[]'); }
      catch (_) { return []; }
    }

    /* ── Envío ── */

    async function saveSubmission(level) {
      const entry = {
        name:     contactInfo.name    || 'Sin nombre',
        business: contactInfo.business || '—',
        level,
        resultTitle: RESULTS[level].title,
        date: new Date().toISOString(),
      };

      storeEntry(entry);

      /* Envío a Netlify Forms → Edu recibe email automático con cada resultado */
      try {
        await fetch('/', {
          method:  'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({
            'form-name': 'cuestionario',
            'bot-field': '',
            name:     entry.name,
            business: entry.business,
            result:   entry.resultTitle,
            price:    RESULTS[level].price,
          }).toString(),
        });
      } catch (e) {
        console.error('Netlify Forms error:', e);
      }
    }

    /* ── Cálculo de resultado ── */

    function computeWinner() {
      const totals = { E: 0, D: 0, R: 0 };
      answers.forEach(a => {
        if (a) { totals.E += a.pts.E; totals.D += a.pts.D; totals.R += a.pts.R; }
      });
      return Object.keys(totals).reduce((a, b) => (totals[b] > totals[a] ? b : a));
    }

    /* ── Render ── */

    function render() {
      if (screen === 'question') renderQuestion();
      else if (screen === 'contact') renderContact();
      else if (screen === 'result')  renderResult();
      else if (screen === 'admin')   renderAdmin();
    }

    function renderQuestion() {
      const q           = QUESTIONS[current];
      const selectedIdx = answers[current] ? answers[current].idx : -1;

      root.innerHTML = `
        <div class="qw-header">
          <div class="qw-eyebrow">Pregunta <b>${current + 1}</b> de ${QUESTIONS.length}</div>
          <div class="qw-track"><div class="qw-fill" style="width:${(current / QUESTIONS.length) * 100}%"></div></div>
        </div>
        <div class="qw-body qw-screen">
          <h2 class="qw-question">${esc(q.q)}</h2>
          ${q.hint ? `<p class="qw-hint">${esc(q.hint)}</p>` : ''}
          <div class="qw-options" id="qwOptions">
            ${q.options.map((o, i) => `
              <button class="qw-option${i === selectedIdx ? ' selected' : ''}" data-idx="${i}" type="button">
                <span class="qw-option-dot" aria-hidden="true"></span>
                <span>${esc(o.text)}</span>
              </button>`).join('')}
          </div>
          <div class="qw-nav">
            <button class="qw-back${current > 0 ? ' visible' : ''}" id="qwBack" type="button">← Volver</button>
            <button class="qw-next${selectedIdx >= 0 ? ' active' : ''}" id="qwNext" type="button">Siguiente</button>
          </div>
          ${current === 0 ? '<button class="qw-footer-link" id="qwAdminLink" type="button">Panel interno</button>' : ''}
        </div>`;

      root.querySelectorAll('.qw-option').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.dataset.idx, 10);
          answers[current] = { idx, pts: q.options[idx].pts };
          root.querySelectorAll('.qw-option').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          document.getElementById('qwNext').classList.add('active');
        });
      });

      const backBtn = document.getElementById('qwBack');
      if (current > 0) backBtn.addEventListener('click', () => { current -= 1; render(); });

      document.getElementById('qwNext').addEventListener('click', () => {
        if (!answers[current]) return;
        if (current === QUESTIONS.length - 1) { screen = 'contact'; render(); }
        else { current += 1; render(); }
      });

      const adminLink = document.getElementById('qwAdminLink');
      if (adminLink) {
        adminLink.addEventListener('click', () => {
          const pass = prompt('Clave de acceso al panel interno:');
          if (pass === ADMIN_PASSPHRASE) { screen = 'admin'; render(); }
          else if (pass !== null) alert('Clave incorrecta.');
        });
      }
    }

    function renderContact() {
      root.innerHTML = `
        <div class="qw-header">
          <div class="qw-eyebrow">Último paso</div>
          <div class="qw-track"><div class="qw-fill" style="width:95%"></div></div>
        </div>
        <div class="qw-body qw-screen">
          <h2 class="qw-question">¿Cómo te llamas?</h2>
          <p class="qw-hint">Así puedo identificar tu resultado y prepararte una propuesta.</p>
          <label for="qwName" class="sr-only">Tu nombre</label>
          <input class="qw-input" id="qwName" type="text" placeholder="Tu nombre *"
                 maxlength="100" autocomplete="given-name" required>
          <label for="qwBusiness" class="sr-only">Nombre de tu negocio</label>
          <input class="qw-input" id="qwBusiness" type="text" placeholder="Nombre de tu negocio (opcional)"
                 maxlength="150" autocomplete="organization">
          <div class="qw-nav">
            <button class="qw-back visible" id="qwBack" type="button">← Volver</button>
            <button class="qw-next" id="qwNext" type="button">Ver mi resultado</button>
          </div>
        </div>`;

      /* Pre-rellenar via .value (nunca via innerHTML para evitar XSS) */
      document.getElementById('qwName').value     = contactInfo.name;
      document.getElementById('qwBusiness').value = contactInfo.business;

      const nameInput = document.getElementById('qwName');
      const nextBtn   = document.getElementById('qwNext');

      function toggle() {
        nextBtn.classList.toggle('active', nameInput.value.trim().length > 0);
      }
      nameInput.addEventListener('input', toggle);
      toggle();

      document.getElementById('qwBack').addEventListener('click', () => {
        screen = 'question'; render();
      });

      nextBtn.addEventListener('click', async () => {
        if (!nameInput.value.trim()) return;
        contactInfo.name     = nameInput.value.trim().slice(0, 100);
        contactInfo.business = document.getElementById('qwBusiness').value.trim().slice(0, 150);
        winnerLevel          = computeWinner();
        nextBtn.textContent  = 'Guardando…';
        nextBtn.classList.remove('active');
        nextBtn.disabled = true;
        await saveSubmission(winnerLevel);
        screen = 'result';
        render();
      });
    }

    function renderResult() {
      const r        = RESULTS[winnerLevel];
      const titleMap = { E: 'Express', D: 'DIAGNÓSTICO', R: 'REDES' };
      const subject  = `Resultado del test — ${contactInfo.name} (${titleMap[winnerLevel]})`;
      const bodyText = [
        `Nombre: ${contactInfo.name}`,
        `Negocio: ${contactInfo.business || '—'}`,
        `Resultado recomendado: ${r.title}`,
        `Rango de precio: ${r.price}`,
        '',
        'Enviado desde el cuestionario inicial — eduardomarin.es/cuestionario.html',
      ].join('\n');

      const mailto = `mailto:${EDU_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(bodyText)}`;

      root.innerHTML = `
        <div class="qw-header">
          <div class="qw-eyebrow">Resultado</div>
          <div class="qw-track"><div class="qw-fill" style="width:100%"></div></div>
        </div>
        <div class="qw-body qw-screen qw-result">
          <div class="qw-result-tag">Tu servicio encaja en</div>
          <h2 class="qw-result-title">${esc(r.title)}</h2>
          <p class="qw-result-desc">${esc(r.desc)}</p>
          <div class="qw-result-price">${esc(r.price)}</div>
          <div class="qw-result-includes">
            <p class="qw-result-includes-title">Suele incluir</p>
            <ul>${r.includes.map(i => `<li>${esc(i)}</li>`).join('')}</ul>
          </div>
          <div class="qw-result-actions">
            <a class="qw-email-btn" href="${mailto}">Enviar resultado a Edu →</a>
            <a class="qw-email-btn" href="onboarding.html"
               style="background:none;border:1.5px solid var(--qw-lime);color:var(--qw-lime);">
              Cuéntame sobre mi negocio →
            </a>
            <button class="qw-restart" id="qwRestart" type="button">↻ Repetir</button>
          </div>
        </div>`;

      document.getElementById('qwRestart').addEventListener('click', () => {
        current = 0; screen = 'question'; answers.fill(null);
        contactInfo = { name: '', business: '' }; winnerLevel = null;
        render();
      });
    }

    function renderAdmin() {
      const entries     = storeList();
      const titleMapAdm = { E: 'Express', D: 'DIAGNÓSTICO', R: 'REDES' };

      const tableHTML = entries.length === 0
        ? '<p class="qw-admin-empty">Todavía no hay respuestas en este dispositivo.</p>'
        : `<div style="overflow-x:auto">
            <table class="qw-admin-table">
              <thead><tr><th>Nombre</th><th>Negocio</th><th>Resultado</th><th>Fecha</th></tr></thead>
              <tbody>
                ${entries.map(e => `
                  <tr>
                    <td>${esc(e.name)}</td>
                    <td>${esc(e.business || '—')}</td>
                    <td>${esc(titleMapAdm[e.level] || e.level || '—')}</td>
                    <td>${esc(new Date(e.date).toLocaleDateString('es-ES'))}</td>
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>`;

      root.innerHTML = `
        <div class="qw-header">
          <div class="qw-eyebrow">Panel interno</div>
          <div class="qw-track"><div class="qw-fill" style="width:100%"></div></div>
        </div>
        <div class="qw-body qw-screen">
          <h2 class="qw-question">Respuestas recibidas</h2>
          <p class="qw-hint">Datos locales de este dispositivo. Las notificaciones completas llegan por email vía Netlify Forms.</p>
          ${tableHTML}
          <button class="qw-restart" id="qwBackToQuiz" style="margin-top:20px;" type="button">← Volver al test</button>
        </div>`;

      document.getElementById('qwBackToQuiz').addEventListener('click', () => {
        current = 0; screen = 'question'; answers.fill(null);
        contactInfo = { name: '', business: '' }; winnerLevel = null;
        render();
      });
    }

    render();
  })();
  </script>

  <script src="js/main.js" defer></script>
</body>
</html>
